<!-- ================================================================
  overrides/main.html · 站点级自定义模板（custom_dir 入口）
  ----------------------------------------------------------------
  Material 主题的模板覆盖接口。需要全站生效的自定义内容加在这里，
  普通写资料完全不用碰这个文件。

  常见用途：
    - 加网站统计代码（如百度统计、Cloudflare Analytics）
    - 加全站公告横幅
    - 加自定义 meta 信息
  ================================================================ -->
{% extends "base.html" %}

{% block extrahead %}
  {# 示例（需要时取消注释）：全站统计代码
  <script> /* 统计代码放这里 */ </script>
  #}
{% endblock %}

{% block content %}
  {# 示例（需要时取消注释）：全站顶部公告
  <aside class="md-banner">
    <div class="md-banner__inner md-grid md-typeset">
      这里写全站公告，比如"国赛备赛中"。
    </div>
  </aside>
  #}
  {{ super() }}
{% endblock %}
