# ================================================================
# deploy.yml · GitHub Actions 自动部署到 GitHub Pages
# ================================================================
# 【这个文件是干什么的】
#   每次你 git push 到 main 分支，GitHub 会自动运行这个脚本：
#   1. 安装 Python 和依赖
#   2. 运行 mkdocs build 构建网站
#   3. 把构建产物（site/ 目录）部署到 GitHub Pages
#
# 【使用前提】
#   1. 仓库已经推送到 GitHub
#   2. 仓库 Settings → Pages → Source 选择 "GitHub Actions"
#   3. 不需要手动配置，push 后自动部署
#
# 【怎么看部署状态】
#   GitHub 仓库页面 → Actions 标签页，可以看到每次部署的日志
# ================================================================

name: deploy                          # 工作流名称，显示在 Actions 页面

# 触发条件：push 到 main 分支时触发
on:
  push:
    branches:
      - main                          # 只在 main 分支 push 时触发
  workflow_dispatch:                  # 允许在 GitHub 网页上手动触发

# 权限设置：允许 Actions 写入 GitHub Pages
permissions:
  contents: read                      # 读取仓库内容
  pages: write                        # 写入 GitHub Pages
  id-token: write                     # 身份验证令牌

# 任务：只有一个部署任务
jobs:
  deploy:
    runs-on: ubuntu-latest            # 在最新版 Ubuntu 上运行
    steps:
      # 第一步：拉取代码
      - name: Checkout                # 步骤名称
        uses: actions/checkout@v4     # 使用官方 checkout 动作，把代码拉到运行环境

      # 第二步：设置 Python 环境
      - name: Setup Python
        uses: actions/setup-python@v5 # 使用官方 setup-python 动作
        with:
          python-version: 3.12        # 使用 Python 3.12

      # 第三步：安装依赖
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # 第四步：配置 GitHub Pages
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 第五步：构建网站
      - name: Build with MkDocs
        run: mkdocs build --clean     # 清理旧构建，重新生成 site/ 目录

      # 第六步：上传构建产物
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/                 # 上传 site/ 目录（构建产物）

      # 第七步：部署到 GitHub Pages
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
