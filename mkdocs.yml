# ============================================================
# mkdocs.yml · 网站总控制台
#
# 这个文件控制网站的一切：叫什么名字、导航怎么排、长什么样、
# 用哪些插件、加载哪些样式和脚本。你以后改网站，90%的情况
# 都是改这个文件。
#
# 三条铁律（违反任意一条都会报错，新手最容易踩的坑）：
#   ① 冒号后面必须有空格        site_name: xxx  ✅
#                               site_name:xxx    ❌
#   ② 只能用空格缩进，禁止 Tab   同一层必须对齐，差一个空格都不行
#   ③ # 开头是注释，机器完全忽略，写多少都不影响运行
# ============================================================


# ============================================================
# 第 1 部分：基本信息
# ============================================================
# 这部分是网站的"身份证"，显示在浏览器标签页、搜索结果里。

site_name: YanYuas-Personal-Website
# ↑ 网站名字。显示在浏览器标签页左上角，也会出现在搜索结果的标题里。
# 改这里就能改网站名，比如改成 "衍煜的个人网站"。

site_description: 数学与应用数学本科生 · 数学建模、数学理论与随笔
# ↑ 网站描述。搜索引擎会显示这个，访客一眼知道你这个站是干什么的。
# 建议用一句话说清"你是谁 + 网站有什么"。


# ============================================================
# 第 2 部分：导航（nav）—— 网站顶部菜单怎么排
# ============================================================
# 【怎么看这一段】
#   左边的中文 = 菜单上显示给人看的名字
#   右边的路径 = 真实文件位置（相对 docs/ 文件夹写）
#   缩进更深一层 = 子菜单（鼠标悬停展开）
#   再深一层 = 孙菜单，以此类推
#
# 【怎么改】
#   加菜单项 → 加一行 "- 名字: 路径.md"
#   删菜单项 → 删掉那一行
#   换顺序 → 上下移动行（上面的排在左边）
#   子菜单 → 下面缩进两格再写
#
# 【注意】路径里的 / 是正斜杠，不是反斜杠 \。Windows 路径习惯用 \，
# 但这里必须用 /，否则 MkDocs 找不到文件。

nav:

  # ---------- 首页 ----------
  # 网站的第一页，访客打开网址看到的第一个页面。
  - 首页: index.md

  # ---------- 数学建模（五个模块） ----------
  # 这是你的主线板块之一，分成五个模块：
  #   1. 建模手的自我修养 —— 个人经历、方法论、团队协作经验
  #   2. 数学与算法基础 —— 算法原理、代码模板、案例集
  #   3. 我的竞赛作品 —— 五场比赛的记录和成果
  #   4. 优秀论文精解 —— 历年优秀论文的拆解分析
  #   5. 深入论文研究 —— 学术研究项目（最小覆盖圆等）
  - 数学建模:
      - 板块导览: mathmodel/index.md
      # ↑ 五个模块的总入口页，有卡片导航和建设进度表
      - 建模手的自我修养: mathmodel/self-cultivation/index.md
      # ↑ 写你自己的故事：参赛经历、踩坑经验、三手协作SOP
      - 数学与算法基础: mathmodel/fundamentals/index.md
      # ↑ 算法知识库，优化模型已深挖，其他方向待补充
      - 我的竞赛作品: mathmodel/works/index.md
      # ↑ 国赛/华数杯/电工杯/五一杯/亚太杯，每场一页
      - 优秀论文精解: mathmodel/paper-analysis/index.md
      # ↑ 读别人的优秀论文，拆方法、学技巧
      - 深入论文研究: mathmodel/research/index.md
      # ↑ 超出竞赛范围的学术研究，目标是产出论文

  # ---------- 数学理论 ----------
  # 高等代数46万字内容在这里，三领域×七模块=21个模块，
  # 每个模块有讲义+习题集（32题/模块，共672道题）。
  - 数学理论:
      - 板块导览: maththeory/index.md
      - 高等代数:
          - 总览: maththeory/advanced-algebra/index.md
          # ↑ 高等代数的总入口，介绍三领域结构和学习路线

          # 方法论与研究：你自己总结的学习方法论和学术论文
          - 方法论与研究:
              - 从初等几何到公理化演进: maththeory/advanced-algebra/theory/从初等几何到公理化演进.md
              - 充要图谱方法论-v2: maththeory/advanced-algebra/theory/充要图谱方法论-v2.md
              - 几何统摄与充要图谱-学术论文: maththeory/advanced-algebra/theory/几何统摄与充要图谱-学术论文.md

          # 领域一：矩阵与基（F1-F7）
          # F = Field（领域），每个专题有讲义+习题集
          - 领域一 · 矩阵与基:
              - 领域导览: maththeory/advanced-algebra/matrix-basis/index.md
              - F1 · 基底与坐标:
                  - 讲义: maththeory/advanced-algebra/matrix-basis/F1-基底与坐标/讲义.md
                  - 习题集: maththeory/advanced-algebra/matrix-basis/F1-基底与坐标/习题集.md
              - F2 · 矩阵运算与分块:
                  - 讲义: maththeory/advanced-algebra/matrix-basis/F2-矩阵运算与分块/讲义.md
                  - 习题集: maththeory/advanced-algebra/matrix-basis/F2-矩阵运算与分块/习题集.md
              - F3 · 行列式:
                  - 讲义: maththeory/advanced-algebra/matrix-basis/F3-行列式/讲义.md
                  - 习题集: maththeory/advanced-algebra/matrix-basis/F3-行列式/习题集.md
              - F4 · 特征理论:
                  - 讲义: maththeory/advanced-algebra/matrix-basis/F4-特征理论/讲义.md
                  - 习题集: maththeory/advanced-algebra/matrix-basis/F4-特征理论/习题集.md
              - F5 · 相似与标准形:
                  - 讲义: maththeory/advanced-algebra/matrix-basis/F5-相似与标准形/讲义.md
                  - 习题集: maththeory/advanced-algebra/matrix-basis/F5-相似与标准形/习题集.md
              - F6 · λ矩阵与若尔当标准形:
                  - 讲义: maththeory/advanced-algebra/matrix-basis/F6-λ矩阵与若尔当标准形/讲义.md
                  - 习题集: maththeory/advanced-algebra/matrix-basis/F6-λ矩阵与若尔当标准形/习题集.md
              - F7 · 矩阵分解:
                  - 讲义: maththeory/advanced-algebra/matrix-basis/F7-矩阵分解/讲义.md
                  - 习题集: maththeory/advanced-algebra/matrix-basis/F7-矩阵分解/习题集.md

          # 领域二：线性空间（G1-G7）
          # G = General（广义空间），从线性空间定义到二次型曲面
          - 领域二 · 线性空间:
              - 领域导览: maththeory/advanced-algebra/linear-space/index.md
              - G1 · 线性空间的定义与基本性质:
                  - 讲义: maththeory/advanced-algebra/linear-space/G1-线性空间的定义与基本性质/讲义.md
                  - 习题集: maththeory/advanced-algebra/linear-space/G1-线性空间的定义与基本性质/习题集.md
              - G2 · 基维数与同构:
                  - 讲义: maththeory/advanced-algebra/linear-space/G2-基维数与同构/讲义.md
                  - 习题集: maththeory/advanced-algebra/linear-space/G2-基维数与同构/习题集.md
              - G3 · 内积空间与正交性:
                  - 讲义: maththeory/advanced-algebra/linear-space/G3-内积空间与正交性/讲义.md
                  - 习题集: maththeory/advanced-algebra/linear-space/G3-内积空间与正交性/习题集.md
              - G4 · 商空间:
                  - 讲义: maththeory/advanced-algebra/linear-space/G4-商空间/讲义.md
                  - 习题集: maththeory/advanced-algebra/linear-space/G4-商空间/习题集.md
              - G5 · 解析几何嵌入:
                  - 讲义: maththeory/advanced-algebra/linear-space/G5-解析几何嵌入/讲义.md
                  - 习题集: maththeory/advanced-algebra/linear-space/G5-解析几何嵌入/习题集.md
              - G6 · 仿射空间:
                  - 讲义: maththeory/advanced-algebra/linear-space/G6-仿射空间/讲义.md
                  - 习题集: maththeory/advanced-algebra/linear-space/G6-仿射空间/习题集.md
              - G7 · 二次型与曲面:
                  - 讲义: maththeory/advanced-algebra/linear-space/G7-二次型与曲面/讲义.md
                  - 习题集: maththeory/advanced-algebra/linear-space/G7-二次型与曲面/习题集.md

          # 领域三：线性变换（T1-T7）
          # T = Transformation（变换），从定义到Jordan标准形
          - 领域三 · 线性变换:
              - 领域导览: maththeory/advanced-algebra/linear-transform/index.md
              - T1 · 线性变换的定义与基本性质:
                  - 讲义: maththeory/advanced-algebra/linear-transform/T1-线性变换的定义与基本性质/讲义.md
                  - 习题集: maththeory/advanced-algebra/linear-transform/T1-线性变换的定义与基本性质/习题集.md
              - T2 · 矩阵表示与相似:
                  - 讲义: maththeory/advanced-algebra/linear-transform/T2-矩阵表示与相似/讲义.md
                  - 习题集: maththeory/advanced-algebra/linear-transform/T2-矩阵表示与相似/习题集.md
              - T3 · 核像与不变子空间:
                  - 讲义: maththeory/advanced-algebra/linear-transform/T3-核像与不变子空间/讲义.md
                  - 习题集: maththeory/advanced-algebra/linear-transform/T3-核像与不变子空间/习题集.md
              - T4 · 特征理论的算子视角:
                  - 讲义: maththeory/advanced-algebra/linear-transform/T4-特征理论的算子视角/讲义.md
                  - 习题集: maththeory/advanced-algebra/linear-transform/T4-特征理论的算子视角/习题集.md
              - T5 · 对角化与谱定理:
