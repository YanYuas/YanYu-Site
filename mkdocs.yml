# ============================================================
# mkdocs.yml · 网站总控制台
#
# 三条铁律（违反任意一条都会报错）：
#   ① 冒号后面必须有空格        site_name: xxx
#   ② 只能用空格缩进，禁止 Tab   同一层必须对齐
#   ③ # 开头是注释，机器完全忽略
# ============================================================

