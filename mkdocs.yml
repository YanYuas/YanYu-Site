theme:
  name: material            # 用 Material 这套主题
  language: zh              # 界面文字用中文（搜索框提示、目录标题等）
  font: false               # 不加载 Google 字体 —— 国内访问更快

  features:                 # 功能开关：想开哪个就加一行，想关就加 # 注释掉
    - navigation.tabs       # 顶部标签导航（个人站观感的关键一项）
    - navigation.top        # 回到顶部按钮
    - navigation.footer     # 内容页底部的「上一页 / 下一页」
                            #   关掉时 Material 根本不渲染那个 nav，
                            #   所以光写 CSS 是隐藏不掉它的（首页改用 front matter 的 hide: [footer]）
    - search.highlight      # 搜索结果高亮关键词
    - content.code.copy     # 代码块右上角一键复制

  palette:                  # 配色方案：两套（深色 / 浅色）
    - media: "(prefers-color-scheme: dark)"
      scheme: starry        # ← 必须与 CSS 里 [data-md-color-scheme="starry"] 完全一致
      primary: custom       # ← custom = 颜色全部交给我的 CSS 处理
      toggle:
        icon: material/weather-night
        name: 切换到浅色模式
    - media: "(prefers-color-scheme: light)"
      scheme: parchment     # ← 浅色那套，对应 CSS 里的 parchment
      primary: custom
      toggle:
        icon: material/white-balance-sunny
        name: 切换到深色模式

# ---------- 插件 ----------
plugins:
  - search:
      # 【为什么必须显式写 lang，不能靠 theme.language: zh 自动带出来】
      # Material 的默认逻辑是去读语言包里的 search.config.lang，
      # 而 zh 语言包只覆盖了 "language"，没覆盖这一项，
      # 于是回落到 en 语言包的值 —— 最终搜索索引是 "lang": ["en"]。
      # 后果：英文分词器 + 英文词干还原，而中文没有空格，
      # "线性空间的定义与基本性质" 会被当成【一个】词条存进去，
      # 搜「线性空间」永远命中不了（lunr 只做整词匹配，不做子串匹配）。
      # 补上 zh 才会启用 jieba 中文分词 —— 就是 requirements.txt 里那个 jieba。
      lang:
        - zh
        - en

# ---------- 4. 自定义样式 ----------
extra_css:                  # 这里的文件最后加载，所以能覆盖 Material 默认外观
  - stylesheets/starry-academic.css   # 全站视觉系统（配色/字体/组件/玻璃）
  - stylesheets/home.css              # 首页版式（Hero/节奏/网格），必须排在后面

# ---------- 5. Markdown 扩展 ----------
markdown_extensions:
  - attr_list               # 支持 { align=center } 这类属性写法
  - md_in_html              # 支持在 HTML 标签里写 Markdown（首页卡片需要它）
  - admonition              # 支持 !!! note / !!! tip 彩色提示框
  - meta                    # 支持页面顶部 hide: 隐藏侧边栏（首页落地页要用）

  # ★ 图标语法 :material-xxx: —— 缺了它，图标会原样显示成 ":material-pencil:{ .lg }" 这堆文本
  #   这是 Material 官方推荐的图标方案，依赖 material 自带的两套翻译器
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # 代码块 + Mermaid 流程图（写数模笔记会用）
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # 数学公式（配合 javascripts/mathjax.js）
  - pymdownx.arithmatex:
      generic: true

  # 其他常用
  - footnotes               # 脚注
  - toc:
      permalink: true         # 标题锚点

# ---------- 6. 脚本 ----------
# ① 首页动态问候语（按时间变化："早上好/下午好/晚上好，我是衍煜"）
# ② MathJax 公式渲染：先加载自己的配置，再加载 MathJax 本体
#    【重要】MathJax 本体已下载到本地 javascripts/vendor/，不再依赖 CDN。
#    原因：原先用的字节跳动镜像 lf26-cdn-tos.bytecdntp.com 已失效（404），
#    会导致全站公式完全不渲染。本地化后既快又稳定，离线也能用。
extra_javascript:
  - javascripts/home-greet.js
  - javascripts/mathjax.js
  - javascripts/vendor/tex-mml-chtml.js
