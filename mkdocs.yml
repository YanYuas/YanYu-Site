  # 以后想挂回来，把目录移回 docs/blog/literature/，在这里加回子菜单就行。
  - 随笔:
      - 随笔总览: blog/index.md
      # ↑ 两个子板块的入口页，有卡片导航
      - 日常随笔: blog/posts/index.md
      # ↑ 生活感悟、零散思考、读书笔记、音乐
      - AI实践: blog/ai-practice/index.md
      # ↑ AI辅助建模/写作/编程的经验、工具评测、Prompt工程

  # ---------- 关于页 ----------
  # 个人介绍：你是谁、做过什么、联系方式、建站说明
  - 关于: about.md


# ============================================================
# 第 3 部分：主题（theme）—— 控制网站外观
# ============================================================
# 主题决定了网站长什么样。Material 是目前最流行的 MkDocs 主题，
# 功能强、好看、移动端适配好，所以选它。

theme:
  name: material
  # ↑ 用哪套主题。material = Material for MkDocs，目前最好用的主题。
  # 换成其他主题名也可以，但大部分功能是 Material 独有的，不建议换。

  language: zh
  # ↑ 界面文字用什么语言。zh = 中文，搜索框提示、"上一页/下一页"、
  # "本页由 GitHub 提供"这些系统文字都会变成中文。

  font: false
  # ↑ 是否加载 Google 字体。
  #   false = 不加载，用系统自带字体 → 国内访问更快，也不会因为墙而卡住
  #   true = 加载 Google 字体（Roboto + Inter）→ 好看但国内可能加载慢
  # 选 false 是因为国内访问 Google Fonts 不稳定，系统字体已经够用了。

  # features：功能开关
  # 【怎么用】想开哪个功能就加一行，想关就加 # 注释掉
  features:
    - navigation.tabs
    # ↑ 顶部标签导航。一级菜单显示在顶部横排，而不是侧边栏。
    # 这是个人站观感的关键——有了它才像"网站"，没有就像"文档"。

    - navigation.top
    # ↑ 回到顶部按钮。页面往下滚时，右下角出现一个↑按钮，点一下回到顶部。

    - navigation.footer
    # ↑ 内容页底部的「上一页 / 下一页」导航。
    # 关掉时 Material 根本不渲染那个 nav，所以光写 CSS 是隐藏不掉它的。
    # 首页如果不想要，可以在首页的 front matter 里写 hide: [footer]。

    - search.highlight
    # ↑ 搜索结果高亮关键词。搜到"矩阵"后，页面里的"矩阵"会高亮显示。

    - content.code.copy
    # ↑ 代码块右上角一键复制按钮。访客看代码时点一下就复制，很方便。

  # palette：配色方案（深色 + 浅色两套）
  # 跟随系统自动切换，访客也可以点右上角按钮手动切换。
  # 【注意】scheme 的名字必须和 CSS 文件里 [data-md-color-scheme="xxx"] 完全一致，
  # 否则切换时颜色不生效。
  palette:
    # 深色模式（系统偏好深色时自动启用）
    - media: "(prefers-color-scheme: dark)"
      scheme: starry
      # ↑ 深色模式的名字，对应 starry-academic.css 里的 starry 配色
      primary: custom
      # ↑ custom = 主色调全部交给我的 CSS 处理，不用 Material 默认色
      toggle:
        icon: material/weather-night
        # ↑ 深色模式下显示的图标（月亮）
        name: 切换到浅色模式
        # ↑ 鼠标悬停时的提示文字

    # 浅色模式（系统偏好浅色时自动启用）
    - media: "(prefers-color-scheme: light)"
      scheme: parchment
      # ↑ 浅色模式的名字，对应 CSS 里的 parchment 配色
      primary: custom
      toggle:
        icon: material/white-balance-sunny
        # ↑ 浅色模式下显示的图标（太阳）
        name: 切换到深色模式


# ============================================================
# 第 4 部分：插件（plugins）
# ============================================================
# 插件是扩展 MkDocs 功能的额外模块。目前只用了搜索插件，
# 但搜索插件的中文配置很关键，必须写对。

plugins:
  - search:
      # 【为什么必须显式写 lang，不能靠 theme.language: zh 自动带出来】
      # Material 的默认逻辑是去读语言包里的 search.config.lang，
      # 而 zh 语言包只覆盖了 "language"，没覆盖这一项，
      # 于是回落到 en 语言包的值 —— 最终搜索索引是 "lang": ["en"]。
      # 后果：英文分词器 + 英文词干还原，而中文没有空格，
      # "线性空间的定义与基本性质" 会被当成【一个】词条存进去，
      # 搜「线性空间」永远命中不了（lunr 只做整词匹配，不做子串匹配）。
      # 补上 zh 才会启用 jieba 中文分词 —— 就是 requirements.txt 里那个 jieba。
      lang:
        - zh   # 中文分词（用 jieba）
        - en   # 英文分词（默认）


# ============================================================
# 第 5 部分：自定义样式（extra_css）
# ============================================================
# 这里列的 CSS 文件会在主题默认样式【之后】加载，
# 所以能覆盖 Material 的默认外观——这就是"自定义主题"的原理。
# 顺序很重要：后面的文件能覆盖前面的。

extra_css:
  - stylesheets/starry-academic.css
  # ↑ 全站视觉系统：配色变量、字体、组件样式、玻璃态效果。
  # 这是网站的"皮肤"，改颜色主要改这个文件顶部的 --sa-* 变量。

  - stylesheets/home.css
  # ↑ 首页专属版式：Hero区域、节奏、卡片网格。
  # 必须排在 starry-academic.css 后面，这样首页样式能覆盖全站默认样式。


# ============================================================
# 第 6 部分：Markdown 扩展（markdown_extensions）
# ============================================================
# Markdown 本身语法很简单，这些扩展让它支持更多高级语法：
# 彩色提示框、图标、代码高亮、数学公式、脚注等等。
# 【原则】用到哪个加哪个，加了就要会用，不用的别加（增加构建时间）。

markdown_extensions:

  # ---------- 基础扩展 ----------
  - attr_list
  # ↑ 支持给元素加属性，比如 { align=center }、{ .class-name }。
  # 首页卡片的图标大小 { .lg .middle } 就靠它。

  - md_in_html
  # ↑ 支持在 HTML 标签里写 Markdown。
  # 首页的 <div class="grid cards" markdown> 里面写 Markdown 就靠它，
  # 没有它，HTML标签里的 Markdown 会原样显示成文本。

  - admonition
  # ↑ 支持彩色提示框：!!! note "标题"、!!! tip、!!! warning、!!! danger。
  # 这是 Material 最常用的扩展之一，写笔记、加注意事项都靠它。

  - meta
  # ↑ 支持页面顶部的 front matter（--- 包裹的元数据），
  # 比如 hide: [footer] 隐藏页脚、title: 自定义标题。首页要用。

  # ---------- 图标扩展 ----------
  # ★ 图标语法 :material-xxx: —— 缺了它，图标会原样显示成
  # ":material-pencil:{ .lg }" 这堆文本，而不是渲染成图标。
  # 这是 Material 官方推荐的图标方案，依赖 material 自带的两套翻译器。
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

  # ---------- 代码高亮 + 流程图 ----------
  - pymdownx.highlight:
      anchor_linenums: true
      # ↑ 代码行号可以作为锚点链接，比如 #L10 直接跳到第10行
  - pymdownx.inlinehilite
  # ↑ 行内代码高亮，比如 `print("hello")` 会带语法高亮
  - pymdownx.superfences:
      # ↑ 增强代码块，支持嵌套代码块、自定义代码块类型
      custom_fences:
        # 自定义 Mermaid 流程图代码块：```mermaid ... ```
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

  # ---------- 数学公式 ----------
  # 配合 javascripts/mathjax.js 渲染 LaTeX 公式。
  # $行内公式$ 或 $$独立公式$$
  - pymdownx.arithmatex:
      generic: true
      # ↑ generic 模式 = 用标准的 \( \) 和 \[ \] 包裹公式，
      # MathJax 能直接识别。不用 generic 的话格式不一样，容易出问题。

  # ---------- 其他常用 ----------
  - footnotes
  # ↑ 脚注：正文里写 [^1]，页面底部写 [^1]: 解释内容。
  # 写学术内容时引用文献很方便。

  - toc:
      permalink: true
      # ↑ 标题锚点：鼠标悬停在标题上时，标题旁边出现 # 符号，
      # 点一下就能复制这个标题的直接链接。方便分享具体段落。


# ============================================================
# 第 7 部分：脚本（extra_javascript）
# ============================================================
# 这里列的 JS 文件会在页面加载时执行。
# 顺序很重要：mathjax.js（配置）必须在 tex-mml-chtml.js（本体）之前加载，
# 否则配置不生效。

extra_javascript:
  - javascripts/home-greet.js
  # ↑ 首页动态问候语：按时间显示"早上好/下午好/晚上好，我是衍煜"。
  # 只在首页生效，其他页面不执行。

  - javascripts/particle-bg.js
  # ↑ 首页粒子星空背景：Canvas 动态粒子 + 鼠标交互 + 流星 + 打字机名字。
  # 只在首页生效（检测 .home 容器），深色模式效果最佳。

  - javascripts/mathjax.js
  # ↑ MathJax 配置文件：自定义宏（\R \N \Z 等数集符号）、
  # 交叉引用（\label \ref \eqref）、自动加载扩展（amsmath/amssymb等）、
  # 容错处理（noerrors/noundefined）、输出配置。
  # 这是公式渲染的"大脑"，改公式行为主要改这个文件。

  - javascripts/vendor/tex-mml-chtml.js
  # ↑ MathJax 本体（1.1MB），已下载到本地。
  # 【重要】原先用的字节跳动 CDN（lf26-cdn-tos.bytecdntp.com）已失效（404），
  # 会导致全站公式完全不渲染。本地化后既快又稳定，离线也能用。
  # 这个文件必须排在 mathjax.js 后面，因为配置要先于本体加载。
